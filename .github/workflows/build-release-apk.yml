name: Build Release APKs (ARMv7 & ARMv8)

on:
  push:
    branches:
      - main
      - master
      - animation
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
      - animation
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g. v1.2.0). Leave empty to auto-tag."
        required: false
        default: ""
      release_notes:
        description: "Optional custom update notes (New Features, Improvements, Fixes). Leave empty to use RELEASE_NOTES.md."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    name: Build Separate ARMv7 & ARMv8 APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Persistent Fallback Keystore
        uses: actions/cache@v4
        with:
          path: ~/.docview-keystore
          key: docview-fallback-keystore-v1

      - name: Prepare Release Keystore & Version Code
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          FALLBACK_CACHE_DIR="$HOME/.docview-keystore"
          FALLBACK_CACHED_JKS="$FALLBACK_CACHE_DIR/my-upload-key.jks"
          DEBUG_KEYSTORE_FILE="${{ github.workspace }}/debug.keystore"
          DEBUG_B64_FILE="${{ github.workspace }}/debug.keystore.base64"

          if [ ! -f "$DEBUG_KEYSTORE_FILE" ]; then
            if [ -f "$DEBUG_B64_FILE" ]; then
              base64 -d "$DEBUG_B64_FILE" > "$DEBUG_KEYSTORE_FILE"
            else
              keytool -genkeypair -v \
                -keystore "$DEBUG_KEYSTORE_FILE" \
                -storetype PKCS12 \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug, O=Android, C=US"
            fi
          fi

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using repository release keystore secrets."
          elif [ -f "$DEBUG_B64_FILE" ] && base64 -d "$DEBUG_B64_FILE" > "$KEYSTORE_FILE" && \
            keytool -changealias -keystore "$KEYSTORE_FILE" -storepass android -alias androiddebugkey -destalias upload; then
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "Prepared release keystore from debug.keystore.base64."
          else
            FALLBACK_PASS="docview-release-key"
            mkdir -p "$FALLBACK_CACHE_DIR"
            if [ ! -f "$FALLBACK_CACHED_JKS" ]; then
              keytool -genkeypair -v \
                -keystore "$FALLBACK_CACHED_JKS" \
                -storetype PKCS12 \
                -alias upload \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "$FALLBACK_PASS" \
                -keypass "$FALLBACK_PASS" \
                -dname "CN=Vilson Sonkar, O=D0C View, C=IN"
              echo "Generated persistent fallback PKCS12 release keystore."
            else
              echo "Reusing cached fallback PKCS12 release keystore for consistent updates."
            fi
            cp "$FALLBACK_CACHED_JKS" "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
          fi

          CI_VERSION_CODE=$(( $(date -u +%s) / 60 ))
          echo "CI_VERSION_CODE=$CI_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Using monotonic versionCode: $CI_VERSION_CODE"

      - name: Clean Up Obsolete Files
        run: |
          if [ -f app/src/main/java/com/example/ui/screens/ScannedDocumentsScreen.kt ] && ! grep -q "ScannedDocumentsScreen" app/src/main/java/com/example/MainActivity.kt; then
            echo "Removing obsolete unused ScannedDocumentsScreen.kt left over on remote branch"
            rm -f app/src/main/java/com/example/ui/screens/ScannedDocumentsScreen.kt
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest --no-daemon --no-configuration-cache

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build Compressed Release APKs (ARMv7 & ARMv8)
        run: gradle :app:assembleRelease --no-daemon --no-configuration-cache

      - name: Collect Separate ARMv7, ARMv8 & Universal Release APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk release-apks/D0C-View-armeabi-v7a-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-apks/D0C-View-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-universal-release.apk release-apks/D0C-View-universal-release.apk
          ls -lh release-apks/

      - name: Upload Separate APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: D0C-View-ARM-Release-APKs
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Prepare Release Metadata & Notes
        id: release_meta
        if: github.event_name != 'pull_request'
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_NOTES: ${{ inputs.release_notes }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_REF" == refs/tags/v* ]]; then
            TAG="$EVENT_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v1.2.${RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=D0C View $TAG" >> "$GITHUB_OUTPUT"

          BODY_FILE="release-notes-body.md"
          {
            echo "## D0C View $TAG"
            echo ""
            echo "- **Release Channel:** Stable Release"
            echo "- **App Version:** \`1.2.${RUN_NUMBER}\` (Version Code: \`${CI_VERSION_CODE}\`)"
            echo "- **Commit:** \`${SHORT_SHA:0:7}\`"
            echo ""
            if [ -n "$INPUT_NOTES" ]; then
              printf '%s\n' "$INPUT_NOTES"
            elif [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
            else
              echo "## New Features"
              echo "- Offline multi-format document viewer (PDF, Word, Excel, PowerPoint, Text)."
              echo ""
              echo "## Improvements"
              echo "- Compressed ARMv7, ARMv8, and Universal APKs with low-storage lossless caching."
              echo ""
              echo "## Fixes"
              echo "- General stability, inset, and external file opening fixes."
            fi
            echo ""
            echo "## APK Downloads & Checksums"
            echo ""
            echo "| APK File | Target ABI | Size | SHA-256 |"
            echo "| --- | --- | --- | --- |"
            for apk in release-apks/*.apk; do
              fname=$(basename "$apk")
              fsize=$(du -h "$apk" | cut -f1)
              fsha=$(sha256sum "$apk" | awk '{print $1}')
              case "$fname" in
                *armeabi-v7a*) abi="ARMv7 (32-bit devices)" ;;
                *arm64-v8a*) abi="ARMv8 (64-bit modern devices, recommended)" ;;
                *universal*) abi="Universal (All supported ABIs)" ;;
                *) abi="Android APK" ;;
              esac
              echo "| \`$fname\` | $abi | $fsize | \`$fsha\` |"
            done
            echo ""
            echo "> **Which APK should I install?** Choose **arm64-v8a** for most modern Android phones, **armeabi-v7a** for older 32-bit devices, or **universal** if unsure."
          } > "$BODY_FILE"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body_path: release-notes-body.md
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release-apks/D0C-View-armeabi-v7a-release.apk
            release-apks/D0C-View-arm64-v8a-release.apk
            release-apks/D0C-View-universal-release.apk
