name: Build Release APKs (ARMv7 & ARMv8)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g. v1.1.0). Leave empty to auto-tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    name: Build Separate ARMv7 & ARMv8 APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using repository release keystore secrets."
          else
            FALLBACK_PASS="docview-release-key"
            keytool -genkeypair \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$FALLBACK_PASS" \
              -alias upload \
              -keypass "$FALLBACK_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Vilson Sonkar, O=D0C View, C=IN"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "Generated fallback upload keystore."
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest --no-daemon

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build Compressed Release APKs (ARMv7 & ARMv8)
        run: gradle :app:assembleRelease --no-daemon

      - name: Collect Separate ARMv7 & ARMv8 Release APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk release-apks/D0C-View-armeabi-v7a-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-apks/D0C-View-arm64-v8a-release.apk
          ls -lh release-apks/

      - name: Upload Separate APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: D0C-View-ARM-Release-APKs
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('v1.1.{0}', github.run_number)) }}
          name: D0C View ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('v1.1.{0}', github.run_number)) }}
          generate_release_notes: true
          files: |
            release-apks/D0C-View-armeabi-v7a-release.apk
            release-apks/D0C-View-arm64-v8a-release.apk
